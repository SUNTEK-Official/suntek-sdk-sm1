// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
 // Maven
    apply from : 'maven.gradle'
    repositories {
//        maven { url 'https://jitpack.io' }
        maven { url 'https://plugins.gradle.org/m2' }
        google()
        maven {url 'https://maven.google.com/'}
//        mavenCentral()
        addCommonMaven(repositories)
        maven { url "https://jitpack.io" }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:4.2.2"
        classpath "io.realm:realm-gradle-plugin:6.0.2"
        classpath 'com.github.dcendents:android-maven-gradle-plugin:1.4.1'
        classpath 'com.jfrog.bintray.gradle:gradle-bintray-plugin:1.3.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        maven { url 'https://repo1.maven.org/maven2' }
        addCommonMaven(repositories)
        mavenCentral()
        maven {url 'https://maven.google.com/'}
        maven { url "https://jitpack.io" }
//        google()
//        mavenCentral()
//        mavenCentral() // Warning: this repository is going to shut down soon
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs.add("-Xbootclasspath/p:${rootProject.projectDir}/SystemLib/libs/ex_framework.jar")
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}


def getDate() {
    def date = new Date()
    def formattedDate = date.format('yyyyMMdd')
    return formattedDate
}

 // Debug
def getDebugSuffix() {
    return "_debug_" + getBranchName() + "_" + getBranchVersion()
}


def getBranchName() {
    def cmd = 'git symbolic-ref --short -q HEAD'
    return cmd.execute().text.trim()
}


def getBranchVersion() {
    def cmd = "git rev-parse --short HEAD"
    return cmd.execute().text.trim()
}