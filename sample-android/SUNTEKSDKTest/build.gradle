import java.text.SimpleDateFormat

plugins {
    id 'com.android.application'
    id 'realm-android'
}

android {

    compileSdkVersion 31
    buildToolsVersion "30.0.2"
    defaultConfig {
        applicationId "com.szanfu.sdk.test"
        minSdkVersion 25
        targetSdkVersion 29
        versionCode Integer.parseInt(SDK_TEST_VC)
        versionName SDK_TEST_VN

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags ""
                abiFilters 'armeabi-v7a'
            }
        }
    }

    buildTypes {
        release {
            versionNameSuffix getDebugSuffix()

        }
        debug {
            versionNameSuffix getDebugSuffix()

        }

    }


    applicationVariants.all { variant ->
        variant.outputs.all {
//            outputFileName = module.name + "_v" + defaultConfig.versionName + "_" + getDate() + "_" + variant.buildType.name + ".apk"
            outputFileName = defaultConfig.applicationId  + "_" + releaseTiem() + "_V"  + defaultConfig.versionName +"_"+ defaultConfig.versionCode+".apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

task outputSdkTest(type: Copy) {
    def versionName = android.defaultConfig.versionName
    def date = getDate()
    from "${buildDir}/outputs/apk/" + COPY_TASK_BUILD_TYPE + "/"
    into OUT_DIR + COPY_TASK_BUILD_TYPE + "/" + date


    exclude { details ->
        details.file.name.contains('-unaligned') ||
                details.file.name.contains('-unsigned') ||
                !details.file.name.contains(versionName) ||
                !details.file.name.contains(date)
    }
    include "**/*.apk"
}
repositories {
    flatDir {
        dirs 'libs'
    }
}

static String releaseTiem(){
    SimpleDateFormat dateFormat = new SimpleDateFormat("yyyyMMddHHmm");
    return dateFormat.format(new Date());
}

